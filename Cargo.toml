[package]
name = "crewride"
version = "0.0.3"
authors = ["fn-a <mr.fna.co@gmail.com>"]
edition = "2024"
repository = "https://github.com/fn-a/crewride"
description = "A high-performance AI proxy service, supporting multiple AI providers (OpenAI, Anthropic, Gemini) with unified API access and cross-provider forwarding capabilities"
license = "MIT"

[dependencies]
axum = "^0.8"
tokio = { version = "^1.48", features = ["full"] }
reqwest = { version = "^0.12", features = ["json", "stream"] }
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
serde_yaml = "^0.9"
futures = "^0.3"
chrono = "^0.4"
url = { version = "^2.5", features = ["serde"] }
eventsource-stream = "^0.2"
anyhow = "^1.0"
thiserror = "^2.0"
tracing = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["env-filter", "json"] }
tower = "^0.5"
tower-http = { version = "^0.6", features = ["cors", "trace"] }
once_cell = "^1.20"
parking_lot = "^0.12"
uuid = { version = "^1.0", features = ["v4"] }

aidapter = "0.0.2"

[dev-dependencies]
tokio-test = "^0.4"
